    <!-- Gene - Nov, 19, 2026: Default to light editorial paper theme using spin-news-theme storage key -->
    <script>
      ;(() => {
        try {
          const saved = localStorage.getItem('spin-news-theme')
          const isDark = saved ? saved === 'dark' : false
          document.documentElement.classList.toggle('dark', isDark)
        } catch {
          document.documentElement.classList.remove('dark')
        }
      })()
    </script>
